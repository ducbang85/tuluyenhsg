            const isBookmarked = user.bookmarks?.includes(selectedLesson?.id);

            const toggleBookmark = (id) => {
                setUser(prev => {
                    const bookmarks = prev.bookmarks || [];
                    const updated = bookmarks.includes(id) ? bookmarks.filter(b => b !== id) : [...bookmarks, id];
                    return { ...prev, bookmarks: updated };
                });
            };

            return (
                <div className="grid md:grid-cols-12 gap-6">
                    {/* Sidebar Danh sách Bài học */}

                                type="text"
                                placeholder="Tìm kiếm bài học, thuật ngữ..."

                                    <div className="space-y-1">
                                        {chapter.lessons
                                            .filter(l => l.title.toLowerCase().includes(searchTerm.toLowerCase()) || l.keyKnowledge.toLowerCase().includes(searchTerm.toLowerCase()))
                                            .map(lesson => (
                                                <button
                                                    key={lesson.id}
                                                    onClick={() => setSelectedLesson(lesson)}
                                                    className={`w-full text-left p-3 rounded-xl text-xs font-medium transition flex items-center justify-between ${selectedLesson?.id === lesson.id ? "bg-blue-50 text-blue-700 border border-blue-200 font-semibold" : "hover:bg-slate-50 text-slate-700"}`}

                                                    <span className="truncate">{lesson.title}</span>

            const [isSubmitted, setIsSubmitted] = useState(false);
            const [hintLevel, setHintLevel] = useState(0); // 0: None, 1: Hint 1, 2: Hint 2, 3: Full Rationale
            const [aiChatLog, setAiChatLog] = useState([]);
            const [loadingAi, setLoadingAi] = useState(false);

            const q = mcqQuestions[currentIndex];

            const handleSelectOption = (idx) => {
                if (isSubmitted && selectedOpt === q.correctIndex) return; // Đã trả lời đúng
                setSelectedOpt(idx);
            };

            const handleSubmitAnswer = () => {
                if (selectedOpt === null) return alert("Vui lòng chọn 1 phương án!");

                const isCorrect = selectedOpt === q.correctIndex;
                setIsSubmitted(true);

                if (isCorrect) {
                    // Cộng điểm
                    setUser(prev => ({
                        ...prev,
                        score: prev.score + q.points,
                        completedCount: prev.completedCount + 1,
                        correctCount: prev.correctCount + 1
                    }));
                } else {
                    // Trả lời sai -> Kích hoạt gợi mở AI Socratic Cấp độ 1
                    setHintLevel(1);
                    setAiChatLog([
                        { role: "ai", text: `Chưa chính xác rồi em nhé! Hãy cùng phân tích lại. ${q.hint1} Em thử suy nghĩ lại xem phương án nào hợp lý nhất?` }
                    ]);
                    setUser(prev => ({
                        ...prev,
                        completedCount: prev.completedCount + 1
                    }));
                }
            };

            const handleRequestMoreHint = () => {
                if (hintLevel === 1) {
                    setHintLevel(2);
                    setAiChatLog(prev => [
                        ...prev,
                        { role: "ai", text: `Gợi ý cấp độ 2: ${q.hint2}. Đừng quên chú ý mối liên hệ giữa các đại lượng kỹ thuật nhé!` }
                    ]);
                } else if (hintLevel === 2) {
                    setHintLevel(3);
                    setAiChatLog(prev => [
                        ...prev,
                        { role: "ai", text: `Lời giải thích đầy đủ: ${q.rationale}` }
                    ]);
                }
            };

            const handleNextQuestion = () => {
                setSelectedOpt(null);
                setIsSubmitted(false);
                setHintLevel(0);
                setAiChatLog([]);
                if (currentIndex < mcqQuestions.length - 1) {
                    setCurrentIndex(currentIndex + 1);
                } else {
                    alert("Bạn đã hoàn thành lượt luyện tập trắc nghiệm!");
                    setCurrentIndex(0);
                }
            };

            if (!q) return <p className="text-slate-500 text-xs">Chưa có câu hỏi trắc nghiệm.</p>;

            return (
                <div className="max-w-4xl mx-auto space-y-6">
                    {/* Header Tiến trình */}
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                        <div className="flex items-center space-x-3">
                            <span className="w-8 h-8 rounded-xl bg-blue-100 text-blue-700 font-bold flex items-center justify-center text-xs">
                                {currentIndex + 1}/{mcqQuestions.length}
                            </span>
                            <div>
                                <span className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">{q.difficulty} • {q.points} điểm</span>
                                <p className="text-xs font-medium text-slate-700">{q.source}</p>
                            </div>
                        </div>

                        <div className="flex space-x-2">
                            <button onClick={handleNextQuestion} className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-4 py-2 rounded-xl transition">
                                Bỏ qua / Câu tiếp &rarr;
                            </button>
                        </div>
                    </div>

                    {/* Câu hỏi Main Box */}
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
                        <h3 className="text-sm md:text-base font-bold text-slate-800 leading-relaxed">
                            {q.question}
                        </h3>

                        {/* Options list */}
                        <div className="space-y-3">
                            {q.options.map((opt, idx) => {
                                let style = "border-slate-200 hover:border-blue-400 bg-white text-slate-700";
                                if (selectedOpt === idx) {
                                    style = "border-blue-500 bg-blue-50 text-blue-800 font-semibold shadow-sm";
                                }
                                if (isSubmitted) {
                                    if (idx === q.correctIndex) {
                                        style = "border-teal-500 bg-teal-50 text-teal-800 font-semibold ring-2 ring-teal-400";
                                    } else if (selectedOpt === idx && selectedOpt !== q.correctIndex) {
                                        style = "border-rose-400 bg-rose-50 text-rose-800 font-medium";
                                    }
                                }

                                return (
                                    <button
                                        key={idx}
                                        onClick={() => handleSelectOption(idx)}
                                        className={`w-full text-left p-4 rounded-xl border text-xs leading-relaxed transition flex items-start space-x-3 ${style}`}
                                    >
                                        <span className="w-5 h-5 rounded-full border border-slate-300 flex items-center justify-center text-[11px] font-bold shrink-0 mt-0.5">
                                            {String.fromCharCode(65 + idx)}
                                        </span>
                                        <span className="flex-1">{opt}</span>
                                    </button>
                                );
                            })}
                        </div>

                        {/* Submit Action */}
                        {!isSubmitted && (
                            <button
                                onClick={handleSubmitAnswer}
                                className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-md transition text-xs"
                            >
                                Xác nhận câu trả lời
                            </button>
                        )}

                        {/* Khung Phản hồi AI Socratic khi Trả Lời Sai hoặc Đúng */}
                        {isSubmitted && (
                            <div className="space-y-4 border-t border-slate-100 pt-4">
                                {selectedOpt === q.correctIndex ? (
                                    <div className="p-4 rounded-xl bg-teal-50 border border-teal-200 space-y-2">
                                        <div className="flex items-center space-x-2 text-teal-700 font-bold text-xs">
                                            <i className="fa-solid fa-circle-check text-base"></i>
                                            <span>Chính xác! Bạn nhận được +{q.points} điểm.</span>
                                        </div>
                                        <p className="text-xs text-teal-800 leading-relaxed">{q.rationale}</p>
                                    </div>
                                ) : (
                                    <div className="p-4 rounded-xl bg-amber-50/80 border border-amber-200 space-y-3">
                                        <div className="flex items-center justify-between">
                                            <div className="flex items-center space-x-2 text-amber-800 font-bold text-xs">
                                                <i className="fa-solid fa-robot text-base text-amber-600"></i>
                                                <span>TRỢ LÝ AI HSG – Hướng dẫn tự suy luận</span>
                                            </div>
                                            <span className="text-[10px] bg-amber-200 text-amber-900 font-bold px-2 py-0.5 rounded-full">Gợi mở Cấp {hintLevel}/3</span>
                                        </div>

                                        <div className="space-y-2">
                                            {aiChatLog.map((msg, i) => (
                                                <div key={i} className="text-xs text-slate-700 leading-relaxed bg-white p-3 rounded-lg border border-amber-100 shadow-sm">
                                                    {msg.text}
                                                </div>
                                            ))}
                                        </div>

                                        {hintLevel < 3 && (
                                            <div className="flex items-center justify-between pt-1">
                                                <button
                                                    onClick={handleRequestMoreHint}
                                                    className="text-xs font-semibold text-amber-800 hover:text-amber-900 underline flex items-center space-x-1"
                                                >
                                                    <i className="fa-solid fa-lightbulb"></i>
                                                    <span>{hintLevel === 1 ? "Tôi vẫn chưa hiểu, xin gợi ý cụ thể hơn" : "Xem đáp án và lời giải chi tiết"}</span>
                                                </button>
                                                <span className="text-[10px] text-slate-400">Thử chọn lại đáp án ở trên!</span>
                                            </div>
                                        )}
                                    </div>
                                )}

                                <button
                                    onClick={handleNextQuestion}
                                    className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-xl shadow transition text-xs flex items-center justify-center space-x-2"
                                >
                                    <span>Chuyển sang câu tiếp theo</span>
                                    <i className="fa-solid fa-arrow-right"></i>
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ==========================================
        // 4. PHÂN HỆ LUYỆN BÀI TẬP TỰ LUẬN HSG
        // ==========================================
        function EssayPracticeTab({ essayQuestions, user, setUser, apiKey }) {
            const [selectedQuestion, setSelectedQuestion] = useState(essayQuestions[0]);
            const [studentAnswer, setStudentAnswer] = useState("");
            const [aiEvaluation, setAiEvaluation] = useState(null);
            const [isEvaluating, setIsEvaluating] = useState(false);
            const [aiHint, setAiHint] = useState("");

            const handleRequestHint = () => {
                setAiHint("Gợi ý dàn ý: 1. Liệt kê đủ 3 phần tử chính (Đầu vào - Vi điều khiển - Đầu ra) + Cảm biến. 2. Phân tích nguyên lý bù chênh lệch nhiệt độ. 3. So sánh hiệu suất điện năng và độ bền cơ khí.");
            };

            const handleSubmitEssay = () => {
                if (!studentAnswer.trim()) return alert("Vui lòng nhập lời giải của bạn trước khi nộp!");
                setIsEvaluating(true);

                // Giả lập hoặc gọi AI chấm bài tự luận dựa trên Rubric
                setTimeout(() => {
                    const hasKeywords = studentAnswer.toLowerCase().includes("mạch kín") || studentAnswer.toLowerCase().includes("phản hồi") || studentAnswer.toLowerCase().includes("cảm biến");
                    const mockScore = hasKeywords ? 17 : 11;

                    const evalResult = {
                        score: mockScore,
                        maxScore: selectedQuestion.maxScore,
                        correctPoints: [
                            "Đã nhận diện đúng bản chất hệ thống kỹ thuật.",
                            "Nêu được cơ chế phản hồi nhiệt độ từ cảm biến."
                        ],
                        missingPoints: [
                            hasKeywords ? "Cần phân tích sâu hơn về tiết kiệm điện năng của công nghệ Inverter." : "Thiếu giải thích cơ chế so sánh tín hiệu phản hồi để điều chỉnh tần số điện thế."
                        ],
                        detailedFeedback: "Bài làm trình bày khá logic. Để đạt điểm tối đa kỳ thi HSG, em nên sử dụng thêm các từ khóa chuyên môn như 'độ chênh lệch tín hiệu đặt', 'vi điều khiển tự động điều tiết'."
                    };

                    setAiEvaluation(evalResult);
                    setIsEvaluating(false);

                    // Tích lũy điểm
                    setUser(prev => ({
                        ...prev,
                        score: prev.score + mockScore,
                        completedCount: prev.completedCount + 1
                    }));
                }, 1500);
            };

            return (
                <div className="grid md:grid-cols-12 gap-6 max-w-6xl mx-auto">
                    {/* List đề thi */}
                    <div className="md:col-span-4 bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                        <h3 className="font-bold text-xs uppercase text-slate-400 tracking-wider">Ngân hàng Đề Tự Luận HSG</h3>
                        <div className="space-y-2">
                            {essayQuestions.map(eq => (
                                <button
                                    key={eq.id}
                                    onClick={() => { setSelectedQuestion(eq); setAiEvaluation(null); setStudentAnswer(""); setAiHint(""); }}
                                    className={`w-full text-left p-3 rounded-xl border text-xs transition ${selectedQuestion?.id === eq.id ? "border-teal-500 bg-teal-50/60 font-semibold text-teal-900" : "border-slate-200 hover:bg-slate-50"}`}
                                >
                                    <p className="font-bold truncate">{eq.title}</p>
                                    <span className="text-[10px] text-slate-500">{eq.difficulty} • Thang điểm {eq.maxScore}</span>
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Workspace */}
                    <div className="md:col-span-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
                        {selectedQuestion && (
                            <div className="space-y-4">
                                <div className="border-b border-slate-100 pb-3">
                                    <span className="text-[10px] bg-teal-100 text-teal-800 font-bold px-2 py-0.5 rounded-full">{selectedQuestion.difficulty}</span>
                                    <h2 className="text-lg font-bold text-slate-800 mt-1">{selectedQuestion.title}</h2>
                                </div>

                                {/* Đề bài */}
                                <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                                    <h4 className="text-xs font-bold text-slate-700">Đề bài & Yêu cầu kỹ thuật:</h4>
                                    <p className="text-xs text-slate-600 whitespace-pre-line leading-relaxed">{selectedQuestion.prompt}</p>
                                </div>

                                {/* Thang điểm Rubric */}
                                <div className="space-y-2">
                                    <h4 className="text-xs font-bold text-slate-700">Thang điểm & Tiêu chí đánh giá (Rubric):</h4>
                                    <div className="space-y-1">
                                        {selectedQuestion.rubric.map((r, i) => (
                                            <div key={i} className="flex justify-between items-center text-[11px] p-2 rounded bg-slate-100/70">
                                                <span className="text-slate-600">{r.criterion}</span>
                                                <span className="font-bold text-slate-800">{r.score}đ</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Area Lời giải */}
                                <div className="space-y-2">
                                    <div className="flex justify-between items-center">
                                        <label className="text-xs font-bold text-slate-700">Bài làm của học sinh:</label>
                                        <button onClick={handleRequestHint} className="text-xs text-amber-600 hover:underline flex items-center space-x-1">
                                            <i className="fa-solid fa-lightbulb"></i><span>Xin AI gợi ý dàn ý</span>
                                        </button>
                                    </div>

                                    {aiHint && (
                                        <div className="p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-800">
                                            {aiHint}
                                        </div>
                                    )}

                                    <textarea
                                        rows={6}
                                        placeholder="Trình bày chi tiết lời giải, lập luận, công thức và các bước phân tích kỹ thuật của em..."
                                        value={studentAnswer}
                                        onChange={(e) => setStudentAnswer(e.target.value)}
                                        className="w-full p-3 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 font-mono"
                                    ></textarea>
                                </div>

                                <button
                                    onClick={handleSubmitEssay}
                                    disabled={isEvaluating}
                                    className="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-xl transition text-xs shadow-md flex items-center justify-center space-x-2"
                                >
                                    {isEvaluating ? (
                                        <span>AI đang chấm bài & phân tích...</span>
                                    ) : (
                                        <>
                                            <i className="fa-solid fa-paper-plane"></i>
                                            <span>Nộp Bài & Nhận Đánh Giá AI</span>
                                        </>
                                    )}
                                </button>

                                {/* Kết quả Đánh giá AI */}
                                {aiEvaluation && (
                                    <div className="p-5 rounded-2xl bg-slate-900 text-white space-y-4">
                                        <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                            <span className="font-bold text-teal-400 text-sm">Kết quả Đánh giá tự động từ Gia Sư AI</span>
                                            <span className="text-lg font-extrabold text-amber-400">{aiEvaluation.score}/{aiEvaluation.maxScore} điểm</span>
                                        </div>

                                        <div className="space-y-2 text-xs">
                                            <p className="font-semibold text-teal-300">Ý làm đúng:</p>
                                            <ul className="list-disc pl-4 space-y-1 text-slate-300">
                                                {aiEvaluation.correctPoints.map((cp, i) => <li key={i}>{cp}</li>)}
                                            </ul>

                                            <p className="font-semibold text-rose-300 pt-2">Ý còn thiếu / Cần hoàn thiện:</p>
                                            <ul className="list-disc pl-4 space-y-1 text-slate-300">
                                                {aiEvaluation.missingPoints.map((mp, i) => <li key={i}>{mp}</li>)}
                                            </ul>

                                            <p className="font-semibold text-amber-300 pt-2">Nhận xét chi tiết cải thiện:</p>
                                            <p className="text-slate-300 leading-relaxed bg-slate-800 p-3 rounded-xl border border-slate-700">{aiEvaluation.detailedFeedback}</p>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ==========================================
        // 5. PHÂN HỆ TRỢ LÝ AI HSG (CHATBOT)
        // ==========================================
        function AiChatTab({ apiKey, user, theoryData }) {
            const [messages, setMessages] = useState([
                { role: "assistant", text: `Chào ${user.name || "bạn"}! Thầy là TRỢ LÝ HSG – NGƯỜI BẠN ĐỒNG HÀNH. Em có câu hỏi hoặc khái niệm kỹ thuật nào cần giải đáp không?` }
            ]);
            const [inputMsg, setInputMsg] = useState("");
            const [loading, setLoading] = useState(false);

            const handleSend = async (e) => {
                e.preventDefault();
                if (!inputMsg.trim()) return;

                const userText = inputMsg;
                setMessages(prev => [...prev, { role: "user", text: userText }]);
                setInputMsg("");
                setLoading(true);

                // Nếu có API Key sẽ gọi Gemini API, nếu không sẽ dùng rule engine trả lời từ database
                if (apiKey) {
                    try {
                        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                contents: [{
                                    parts: [{ text: `Bạn là gia sư AI môn Công nghệ THPT ôn thi học sinh giỏi. Hãy gợi mở tư duy cho học sinh, không cho lời giải trực tiếp ngay lập tức nếu hỏi bài tập. Câu hỏi của học sinh: ${userText}` }]
                                }]
                            })
                        });
                        const data = await res.json();
                        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Xin lỗi em, hiện tại kết nối AI đang gián đoạn.";
                        setMessages(prev => [...prev, { role: "assistant", text: reply }]);
                    } catch (err) {
                        setMessages(prev => [...prev, { role: "assistant", text: "Lỗi kết nối API Key. Thầy sẽ giải đáp bằng dữ liệu tri thức tích hợp sẵn." }]);
                    }
                } else {
                    // Smart Offline Simulation
                    setTimeout(() => {
                        let reply = "Để trả lời câu hỏi này, em hãy nhớ lại nguyên lý: Kỹ thuật ứng dụng tri thức khoa học để tạo sản phẩm. Em muốn tìm hiểu sâu hơn ở Bài học nào trong Chương I hay Chương II?";
                        if (userText.toLowerCase().includes("mạch kín") || userText.toLowerCase().includes("phản hồi")) {
                            reply = "Trong hệ thống mạch kín, điểm cốt lõi là 'Tín hiệu phản hồi' (Feedback). Tín hiệu đầu ra được đo và truyền ngược lại bộ xử lý để tự động điều chỉnh. Em có thể lấy ví dụ cụ thể về bàn là tự động ngắt điện không?";
                        } else if (userText.toLowerCase().includes("cad") || userText.toLowerCase().includes("cnc")) {
                            reply = "Chuỗi CAD/CAM/CNC kết nối từ Thiết kế 3D (CAD) -> Lập quy trình & đường chạy dao (CAM) -> Máy gia công tự động (CNC). Em đã nắm rõ vai trò của từng khâu chưa?";
                        }
                        setMessages(prev => [...prev, { role: "assistant", text: reply }]);
                        setLoading(false);
                    }, 1000);
                }
            };

            return (
                <div className="max-w-3xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col h-[650px]">
                    {/* Chat Header */}
                    <div className="p-4 border-b border-slate-100 bg-gradient-to-r from-blue-700 to-indigo-700 text-white rounded-t-2xl flex items-center space-x-3">
                        <div className="w-10 h-10 rounded-full bg-amber-400 text-slate-900 font-bold flex items-center justify-center">
                            <i className="fa-solid fa-robot text-lg"></i>
                        </div>
                        <div>
                            <h3 className="font-bold text-sm">TRỢ LÝ HSG – NGƯỜI BẠN ĐỒNG HÀNH</h3>
                            <p className="text-[11px] text-blue-100">Gia sư AI Chuyên Sâu Môn Công Nghệ THPT</p>
                        </div>
                    </div>

                    {/* Messages Container */}
                    <div className="flex-1 p-4 overflow-y-auto space-y-4 custom-scrollbar bg-slate-50/50">
                        {messages.map((m, idx) => (
                            <div key={idx} className={`flex ${m.role === "user" ? "justify-end" : "justify-start"}`}>
                                <div className={`max-w-[80%] p-3.5 rounded-2xl text-xs leading-relaxed ${m.role === "user" ? "bg-blue-600 text-white rounded-br-none" : "bg-white text-slate-800 border border-slate-200/80 shadow-sm rounded-bl-none space-y-1"}`}>
                                    {m.role === "assistant" && (
                                        <span className="text-[10px] font-bold text-blue-600 block mb-1">
                                            <i className="fa-solid fa-sparkles mr-1"></i>Trợ lý AI HSG
                                        </span>
                                    )}
                                    <p className="whitespace-pre-line">{m.text}</p>
                                </div>
                            </div>
                        ))}
                        {loading && (
                            <div className="flex justify-start">
                                <div className="bg-white p-3 rounded-2xl border border-slate-200 text-xs text-slate-400 animate-pulse">
                                    AI đang suy nghĩ lời gợi mở...
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Input Form */}
                    <form onSubmit={handleSend} className="p-3 border-t border-slate-200 bg-white rounded-b-2xl flex items-center space-x-2">
                        <input
                            type="text"
                            placeholder="Đặt câu hỏi về kiến thức, công thức hoặc dạng bài tập..."
                            value={inputMsg}
                            onChange={(e) => setInputMsg(e.target.value)}
                            className="flex-1 p-3 bg-slate-100 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />
                        <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-xl transition shadow text-xs">
                            <i className="fa-solid fa-paper-plane"></i>
                        </button>
                    </form>
                </div>
            );
        }

        // ==========================================
        // 6. PHÂN HỆ BẢNG XẾP HẠNG & THỐNG KÊ
        // ==========================================
        function LeaderboardTab({ leaderboard, user }) {
            const sortedLeaderboard = useMemo(() => {
                return [...leaderboard].sort((a, b) => b.points - a.points || b.accuracy - a.accuracy);
            }, [leaderboard]);

            return (
                <div className="max-w-4xl mx-auto space-y-6">
                    <div className="bg-gradient-to-r from-amber-500 to-amber-600 p-6 rounded-2xl text-white shadow-md flex items-center justify-between">
                        <div>
                            <h2 className="text-xl font-extrabold">BẢNG XẾP HẠNG HỌC SINH GIỎI</h2>
                            <p className="text-xs text-amber-100 mt-1">Xếp hạng công bằng dựa trên Tổng điểm tích lũy & Tỷ lệ chính xác</p>
                        </div>
                        <i className="fa-solid fa-trophy text-5xl text-amber-200 opacity-80"></i>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <table className="w-full text-xs text-left">
                            <thead className="bg-slate-100 text-slate-600 font-bold uppercase tracking-wider">
                                <tr>
                                    <th className="p-4 text-center">Thứ hạng</th>
                                    <th className="p-4">Học sinh</th>
                                    <th className="p-4">Lớp / Trường</th>
                                    <th className="p-4 text-center">Đã hoàn thành</th>
                                    <th className="p-4 text-center">Tỷ lệ đúng</th>
                                    <th className="p-4 text-right">Tổng điểm</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {sortedLeaderboard.map((item, idx) => {
                                    const isMe = item.name === user.name;
                                    let rankBadge = <span className="font-bold text-slate-600">{idx + 1}</span>;
                                    if (idx === 0) rankBadge = <span className="w-6 h-6 rounded-full bg-amber-400 text-slate-900 font-extrabold flex items-center justify-center mx-auto shadow">1</span>;
                                    if (idx === 1) rankBadge = <span className="w-6 h-6 rounded-full bg-slate-300 text-slate-800 font-extrabold flex items-center justify-center mx-auto shadow">2</span>;
                                    if (idx === 2) rankBadge = <span className="w-6 h-6 rounded-full bg-amber-700 text-white font-extrabold flex items-center justify-center mx-auto shadow">3</span>;

                                    return (
                                        <tr key={item.id} className={isMe ? "bg-amber-50/80 font-bold text-slate-900" : "hover:bg-slate-50 text-slate-700"}>
                                            <td className="p-4 text-center">{rankBadge}</td>
                                            <td className="p-4 flex items-center space-x-2">
                                                <span className="font-semibold">{item.name}</span>
                                                {isMe && <span className="text-[10px] bg-amber-200 text-amber-900 px-1.5 py-0.5 rounded font-bold">Bạn</span>}
                                            </td>
                                            <td className="p-4 text-slate-500">{item.class || "THPT"}</td>
                                            <td className="p-4 text-center">{item.completedCount} câu</td>
                                            <td className="p-4 text-center">{item.accuracy}%</td>
                                            <td className="p-4 text-right font-extrabold text-blue-700">{item.points} đ</td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 7. PHÂN HỆ QUẢN TRỊ GIÁO VIÊN
        // ==========================================
        function AdminTab({ mcqQuestions, setMcqQuestions, essayQuestions, setEssayQuestions, theoryData, setTheoryData, leaderboard, setApiKey, currentApiKey }) {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [passInput, setPassInput] = useState("");
            const [tempKey, setTempKey] = useState(currentApiKey);

            // Modal thêm câu hỏi trắc nghiệm
            const [newMcq, setNewMcq] = useState({
                question: "", options: ["", "", "", ""], correctIndex: 0, points: 5, difficulty: "Thông hiểu", source: "Tài liệu Giáo viên", hint1: "", hint2: "", rationale: ""
            });

            const handleLogin = (e) => {
                e.preventDefault();
                if (passInput === "admin123" || passInput === "giaovien") {
                    setIsAuthenticated(true);
                } else {
                    alert("Mật khẩu quản trị không đúng! (Gợi ý: giaovien)");
                }
            };

            const handleAddMcq = (e) => {
                e.preventDefault();
                if (!newMcq.question || newMcq.options.some(o => !o.trim())) return alert("Vui lòng điền đầy đủ câu hỏi và 4 phương án!");

                const created = { ...newMcq, id: 'q_' + Date.now(), topicId: 'b1' };
                setMcqQuestions(prev => [...prev, created]);
                alert("Đã thêm câu hỏi trắc nghiệm mới thành công!");
                setNewMcq({ question: "", options: ["", "", "", ""], correctIndex: 0, points: 5, difficulty: "Thông hiểu", source: "Tài liệu Giáo viên", hint1: "", hint2: "", rationale: "" });
            };

            if (!isAuthenticated) {
                return (
                    <div className="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                        <div className="text-center space-y-1">
                            <div className="w-12 h-12 bg-indigo-100 text-indigo-700 rounded-2xl flex items-center justify-center mx-auto text-xl font-bold">
                                <i className="fa-solid fa-lock"></i>
                            </div>
                            <h3 className="font-bold text-base text-slate-800">Đăng Nhập Trang Quản Trị Giáo Viên</h3>
                            <p className="text-xs text-slate-500">Quản lý câu hỏi, tài liệu và cấu hình hệ thống AI</p>
                        </div>

                        <form onSubmit={handleLogin} className="space-y-3">
                            <input
                                type="password"
                                placeholder="Nhập mật khẩu giáo viên..."
                                value={passInput}
                                onChange={(e) => setPassInput(e.target.value)}
                                className="w-full p-3 bg-slate-100 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500"
                            />
                            <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition text-xs shadow">
                                Đăng Nhập Quản Trị
                            </button>
                        </form>
                    </div>
                );
            }

            return (
                <div className="max-w-5xl mx-auto space-y-8">
                    <div className="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200">
                        <div>
                            <h2 className="font-bold text-base text-slate-800">BẢNG QUẢN TRỊ GIÁO VIÊN</h2>
                            <p className="text-xs text-slate-500">Quản lý ngân hàng đề, theo dõi lớp học & Cấu hình AI Gemini</p>
                        </div>
                        <button onClick={() => setIsAuthenticated(false)} className="text-xs bg-rose-50 text-rose-600 font-semibold px-3 py-1.5 rounded-lg">
                            Đăng xuất Quản trị
                        </button>
                    </div>

                    {/* Configuration AI Key */}
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 space-y-3">
                        <h3 className="font-bold text-sm text-slate-800 flex items-center space-x-2">
                            <i className="fa-solid fa-key text-amber-500"></i><span>Cấu hình API Key AI (Google Gemini API)</span>
                        </h3>
                        <p className="text-xs text-slate-500">Nhập API Key để kích hoạt khả năng phản hồi AI thực tế cho khung chat và chấm bài tự luận nâng cao.</p>
                        <div className="flex space-x-2">
                            <input
                                type="password"
                                placeholder="AIzaSy..."
                                value={tempKey}
                                onChange={(e) => setTempKey(e.target.value)}
                                className="flex-1 p-2.5 bg-slate-100 rounded-xl text-xs font-mono"
                            />
                            <button onClick={() => setApiKey(tempKey)} className="bg-slate-800 text-white text-xs font-bold px-4 py-2.5 rounded-xl">
                                Lưu API Key
                            </button>
                        </div>
                    </div>

                    {/* Thêm câu hỏi Trắc nghiệm */}
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 space-y-4">
                        <h3 className="font-bold text-sm text-slate-800">Thêm Câu Hỏi Trắc Nghiệm Mới</h3>

                        <form onSubmit={handleAddMcq} className="space-y-4">
                            <div>
                                <label className="text-xs font-bold text-slate-700 block mb-1">Nội dung câu hỏi:</label>
                                <textarea
                                    rows={2}
                                    placeholder="Nhập nội dung câu hỏi trắc nghiệm..."
                                    value={newMcq.question}
                                    onChange={(e) => setNewMcq({ ...newMcq, question: e.target.value })}
                                    className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs"
                                ></textarea>
                            </div>

                            <div className="grid grid-cols-2 gap-3">
                                {newMcq.options.map((opt, i) => (
                                    <div key={i}>
                                        <label className="text-[11px] font-semibold text-slate-600 block mb-1">Phương án {String.fromCharCode(65 + i)}:</label>
                                        <input
                                            type="text"
                                            value={opt}
                                            onChange={(e) => {
                                                const opts = [...newMcq.options];
                                                opts[i] = e.target.value;
                                                setNewMcq({ ...newMcq, options: opts });
                                            }}
                                            className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs"
                                        />
                                    </div>
                                ))}
                            </div>

                            <div className="grid grid-cols-3 gap-3">
                                <div>
                                    <label className="text-[11px] font-semibold text-slate-600 block mb-1">Đáp án đúng:</label>
                                    <select
                                        value={newMcq.correctIndex}
                                        onChange={(e) => setNewMcq({ ...newMcq, correctIndex: parseInt(e.target.value) })}
                                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-bold"
                                    >
                                        <option value={0}>Phương án A</option>
                                        <option value={1}>Phương án B</option>
                                        <option value={2}>Phương án C</option>
                                        <option value={3}>Phương án D</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="text-[11px] font-semibold text-slate-600 block mb-1">Mức độ khó:</label>
                                    <select
                                        value={newMcq.difficulty}
                                        onChange={(e) => setNewMcq({ ...newMcq, difficulty: e.target.value })}
                                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs"
                                    >
                                        <option value="Nhận biết">Nhận biết</option>
                                        <option value="Thông hiểu">Thông hiểu</option>
                                        <option value="Vận dụng">Vận dụng</option>
                                        <option value="Vận dụng cao">Vận dụng cao</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="text-[11px] font-semibold text-slate-600 block mb-1">Số điểm:</label>
                                    <input
                                        type="number"
                                        value={newMcq.points}
                                        onChange={(e) => setNewMcq({ ...newMcq, points: parseInt(e.target.value) })}
                                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs"
                                    />
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="text-[11px] font-semibold text-slate-600 block mb-1">Gợi ý cấp 1 (Dẫn dắt không lộ đáp án):</label>
                                    <input
                                        type="text"
                                        value={newMcq.hint1}
                                        onChange={(e) => setNewMcq({ ...newMcq, hint1: e.target.value })}
                                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs"
                                    />
                                </div>
                                <div>
                                    <label className="text-[11px] font-semibold text-slate-600 block mb-1">Lời giải thích chuẩn:</label>
                                    <input
                                        type="text"
                                        value={newMcq.rationale}
                                        onChange={(e) => setNewMcq({ ...newMcq, rationale: e.target.value })}
                                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs"
                                    />
                                </div>
                            </div>

                            <button type="submit" className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2.5 rounded-xl text-xs transition">
                                + Lưu vào Ngân hàng Câu hỏi
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // Mount React App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
